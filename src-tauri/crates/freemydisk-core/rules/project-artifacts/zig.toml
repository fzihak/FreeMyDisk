[project]
id = "project_zig"
name = "Zig Projects"
description = "Zig compilation cache and output binaries"
icon = "zig"

[[detection]]
marker_file = "build.zig"

[[artifacts]]
relative_path = "zig-cache"
category = "cache"
risk = "safe"
verified_rebuildable = true

[[artifacts]]
relative_path = "zig-out"
category = "build_output"
risk = "safe"
verified_rebuildable = true
rebuild_command = "zig build"
