[project]
id = "project_maven"
name = "Apache Maven Projects"
description = "Maven compiled target directory and test report outputs"
icon = "maven"

[[detection]]
marker_file = "pom.xml"

[[artifacts]]
relative_path = "target"
category = "build_output"
risk = "safe"
verified_rebuildable = true
rebuild_command = "mvn clean compile"
