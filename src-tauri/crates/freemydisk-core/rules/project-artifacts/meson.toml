[project]
id = "project_meson"
name = "Meson Build Projects"
description = "Meson compilation build directories"
icon = "meson"

[[detection]]
marker_file = "meson.build"

[[artifacts]]
relative_path = "builddir"
category = "build_output"
risk = "safe"
verified_rebuildable = true
rebuild_command = "meson compile -C builddir"

[[artifacts]]
relative_path = "build"
category = "build_output"
risk = "safe"
verified_rebuildable = true
