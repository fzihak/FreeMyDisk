[project]
id = "project_swift"
name = "Swift Package Manager"
description = "Swift build outputs and DerivedData"
icon = "swift"

[[detection]]
marker_file = "Package.swift"

[[artifacts]]
relative_path = ".build"
category = "build_output"
risk = "safe"
verified_rebuildable = true
rebuild_command = "swift build"

[[artifacts]]
relative_path = "DerivedData"
category = "cache"
risk = "safe"
verified_rebuildable = true
