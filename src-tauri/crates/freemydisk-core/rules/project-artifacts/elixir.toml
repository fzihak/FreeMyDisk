[project]
id = "project_elixir"
name = "Elixir / Phoenix Projects"
description = "Mix build artifacts and dependencies"
icon = "elixir"

[[detection]]
marker_file = "mix.exs"

[[artifacts]]
relative_path = "_build"
category = "build_output"
risk = "safe"
verified_rebuildable = true
rebuild_command = "mix compile"

[[artifacts]]
relative_path = "deps"
category = "dependencies"
risk = "safe"
verified_rebuildable = true
rebuild_command = "mix deps.get"
