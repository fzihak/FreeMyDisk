[rule]
id = "windows_app_adobe_creative_cloud_logs"
name = "Adobe Creative Cloud Diagnostic Logs"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Accumulated sync logs and updater crash dumps from Adobe Creative Cloud"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Adobe" }
]

[targets]
paths = [
    { path = "${local_app_data}/Adobe/Creative Cloud/ACC/Logs/*", matcher = "glob" },
    { path = "${local_app_data}/Adobe/CoreSync/plugins/logs/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = []
