[rule]
id = "windows_application_slack_cache"
name = "Slack App Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-08-15"
author = "FreeMyDisk Team"
description = "Cached media, web resources, and Service Worker storage from Slack"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Slack/Cache" }
]

[targets]
paths = [
    { path = "${app_data}/Slack/Cache/*", matcher = "glob" },
    { path = "${app_data}/Slack/Code Cache/*", matcher = "glob" },
    { path = "${app_data}/Slack/Service Worker/CacheStorage/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = [
    "*/storage/*",
    "*/Cookies*"
]
