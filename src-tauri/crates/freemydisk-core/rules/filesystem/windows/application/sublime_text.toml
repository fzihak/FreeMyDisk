[rule]
id = "windows_app_sublime_text_cache"
name = "Sublime Text Index Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Symbol index and syntax definition cache from Sublime Text"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Sublime Text" }
]

[targets]
paths = [
    { path = "${local_app_data}/Sublime Text/Cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
