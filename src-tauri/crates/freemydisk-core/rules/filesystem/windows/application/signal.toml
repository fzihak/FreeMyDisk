[rule]
id = "windows_app_signal_cache"
name = "Signal Desktop Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Electron GPU and HTTP web cache from Signal Desktop"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Signal" }
]

[targets]
paths = [
    { path = "${app_data}/Signal/Cache/*", matcher = "glob" },
    { path = "${app_data}/Signal/Code Cache/*", matcher = "glob" },
    { path = "${app_data}/Signal/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/sql/*", "*/config.json"]
