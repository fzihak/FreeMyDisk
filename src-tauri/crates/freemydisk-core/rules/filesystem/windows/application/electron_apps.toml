[rule]
id = "windows_app_electron_generic_cache"
name = "Generic Electron App Caches"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Common GPU and Chromium web caches across third-party Electron applications"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}" }
]

[targets]
paths = [
    { path = "${app_data}/*/GPUCache/*", matcher = "glob" },
    { path = "${local_app_data}/*/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/Microsoft/*", "*/Windows/*"]
