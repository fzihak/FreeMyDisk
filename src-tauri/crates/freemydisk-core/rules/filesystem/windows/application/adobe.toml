[rule]
id = "windows_app_adobe_media_cache"
name = "Adobe Premiere & Media Encoder Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-01"
author = "FreeMyDisk Team"
description = "Large conforming audio and scratch video preview files generated by Adobe applications"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Adobe/Common/Media Cache Files" }
]

[targets]
paths = [
    { path = "${app_data}/Adobe/Common/Media Cache Files/*", matcher = "glob" },
    { path = "${app_data}/Adobe/Common/Media Cache/*", matcher = "glob" },
    { path = "${app_data}/Adobe/Common/Peak Files/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
