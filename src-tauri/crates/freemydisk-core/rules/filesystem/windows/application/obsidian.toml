[rule]
id = "windows_app_obsidian_cache"
name = "Obsidian App Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Electron GPU cache, indexing cache, and logs from Obsidian (does NOT touch vaults)"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/obsidian" }
]

[targets]
paths = [
    { path = "${app_data}/obsidian/Cache/*", matcher = "glob" },
    { path = "${app_data}/obsidian/Code Cache/*", matcher = "glob" },
    { path = "${app_data}/obsidian/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/obsidian.json"]
