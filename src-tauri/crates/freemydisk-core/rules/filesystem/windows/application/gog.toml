[rule]
id = "windows_app_gog_galaxy_cache"
name = "GOG Galaxy Web Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web engine cache, download cache, and crash logs from GOG Galaxy"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/GOG.com/Galaxy" }
]

[targets]
paths = [
    { path = "${local_app_data}/GOG.com/Galaxy/webcache/*", matcher = "glob" },
    { path = "${program_data}/GOG.com/Galaxy/logs/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/storage/*"]
