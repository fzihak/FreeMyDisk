[rule]
id = "windows_app_skype_cache"
name = "Skype for Desktop Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web view cache and temporary media cache from Skype for Desktop"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Microsoft/Skype for Desktop" }
]

[targets]
paths = [
    { path = "${app_data}/Microsoft/Skype for Desktop/Cache/*", matcher = "glob" },
    { path = "${app_data}/Microsoft/Skype for Desktop/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/skylib/*"]
