[rule]
id = "windows_app_discord_canary_cache"
name = "Discord Canary Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web cache and GPU shader cache from Discord Canary client"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/discordcanary" }
]

[targets]
paths = [
    { path = "${app_data}/discordcanary/Cache/*", matcher = "glob" },
    { path = "${app_data}/discordcanary/Code Cache/*", matcher = "glob" },
    { path = "${app_data}/discordcanary/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/settings.json"]
