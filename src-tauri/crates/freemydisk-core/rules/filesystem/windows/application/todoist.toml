[rule]
id = "windows_app_todoist_cache"
name = "Todoist Desktop Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web assets and GPU cache from Todoist Windows application"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Todoist" }
]

[targets]
paths = [
    { path = "${app_data}/Todoist/Cache/*", matcher = "glob" },
    { path = "${app_data}/Todoist/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
