[rule]
id = "windows_app_postman_cache"
name = "Postman API Client Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-01"
author = "FreeMyDisk Team"
description = "Temporary cache, network logs and GPU shaders generated by Postman"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Postman/Cache" }
]

[targets]
paths = [
    { path = "${app_data}/Postman/Cache/*", matcher = "glob" },
    { path = "${app_data}/Postman/Code Cache/*", matcher = "glob" },
    { path = "${app_data}/Postman/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
