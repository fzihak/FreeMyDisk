[rule]
id = "windows_app_electron_updater_pending"
name = "Electron Staged Installers"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Downloaded update packages and staging files left behind by Electron auto-updaters"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}" }
]

[targets]
paths = [
    { path = "${local_app_data}/*-updater/pending/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
