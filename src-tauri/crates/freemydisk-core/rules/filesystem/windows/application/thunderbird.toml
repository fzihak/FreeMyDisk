[rule]
id = "windows_app_thunderbird_cache"
name = "Mozilla Thunderbird Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Email rendering cache, startup cache, and temp files from Thunderbird"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Thunderbird" }
]

[targets]
paths = [
    { path = "${local_app_data}/Thunderbird/Profiles/*/cache2/*", matcher = "glob" },
    { path = "${local_app_data}/Thunderbird/Profiles/*/startupCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/ImapMail/*", "*/Mail/*"]
