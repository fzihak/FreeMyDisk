[rule]
id = "windows_app_google_drive_logs"
name = "Google Drive Desktop Logs"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Crash logs, diagnostic logs, and temporary sync fragments from Google Drive"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Google/DriveFS" }
]

[targets]
paths = [
    { path = "${local_app_data}/Google/DriveFS/logs/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["*/content_cache/*", "*/root/*"]
