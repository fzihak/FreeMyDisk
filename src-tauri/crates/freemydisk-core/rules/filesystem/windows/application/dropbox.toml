[rule]
id = "windows_app_dropbox_cache"
name = "Dropbox Sync Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Temporary staging sync cache and thumbnail chunks from Dropbox desktop client"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Dropbox" }
]

[targets]
paths = [
    { path = "${local_app_data}/Dropbox/cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
