[rule]
id = "windows_app_obs_cache"
name = "OBS Studio Logs & Crash Reports"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Diagnostic session logs and crash dumps from OBS Studio"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/obs-studio" }
]

[targets]
paths = [
    { path = "${app_data}/obs-studio/logs/*", matcher = "glob" },
    { path = "${app_data}/obs-studio/crashes/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["*/basic/*", "*/global.ini"]
