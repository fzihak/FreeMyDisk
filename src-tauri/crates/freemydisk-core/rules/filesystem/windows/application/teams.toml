[rule]
id = "windows_app_teams_cache"
name = "Microsoft Teams Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Cached images, media, and Electron runtime cache from Microsoft Teams"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Microsoft/Teams" }
]

[targets]
paths = [
    { path = "${app_data}/Microsoft/Teams/Cache/*", matcher = "glob" },
    { path = "${app_data}/Microsoft/Teams/blob_storage/*", matcher = "glob" },
    { path = "${app_data}/Microsoft/Teams/databases/*", matcher = "glob" },
    { path = "${app_data}/Microsoft/Teams/GPUcache/*", matcher = "glob" },
    { path = "${app_data}/Microsoft/Teams/IndexedDB/*", matcher = "glob" },
    { path = "${local_app_data}/Packages/MSTeams_8wekyb3d8bbwe/LocalCache/Microsoft/MSTeams/Logs/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/settings.json"]
