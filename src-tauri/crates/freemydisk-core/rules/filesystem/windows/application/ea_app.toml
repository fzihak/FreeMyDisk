[rule]
id = "windows_app_ea_app_cache"
name = "EA Desktop Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web cache, in-game overlay cache, and logs from Electronic Arts EA App"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Electronic Arts/EA Desktop" }
]

[targets]
paths = [
    { path = "${local_app_data}/Electronic Arts/EA Desktop/IGOCache/*", matcher = "glob" },
    { path = "${local_app_data}/Electronic Arts/EA Desktop/Logs/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
