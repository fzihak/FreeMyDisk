[rule]
id = "windows_app_itchio_cache"
name = "itch.io Client Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Downloaded thumbnails, web cache, and staging downloads from itch.io app"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/itch" }
]

[targets]
paths = [
    { path = "${app_data}/itch/downloads/*", matcher = "glob" },
    { path = "${app_data}/itch/cache/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["*/db/*"]
