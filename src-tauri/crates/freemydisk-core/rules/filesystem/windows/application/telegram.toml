[rule]
id = "windows_app_telegram_cache"
name = "Telegram Desktop Media Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-01"
author = "FreeMyDisk Team"
description = "Cached voice messages, images and temp files in Telegram"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Telegram Desktop/tdata/temp" }
]

[targets]
paths = [
    { path = "${app_data}/Telegram Desktop/tdata/temp/*", matcher = "glob" },
    { path = "${app_data}/Telegram Desktop/tdata/user_data/cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
