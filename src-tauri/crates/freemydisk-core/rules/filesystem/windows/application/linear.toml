[rule]
id = "windows_app_linear_cache"
name = "Linear Desktop Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Offline issues cache and web view cache from Linear Desktop"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Linear" }
]

[targets]
paths = [
    { path = "${app_data}/Linear/Cache/*", matcher = "glob" },
    { path = "${app_data}/Linear/Code Cache/*", matcher = "glob" },
    { path = "${app_data}/Linear/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
