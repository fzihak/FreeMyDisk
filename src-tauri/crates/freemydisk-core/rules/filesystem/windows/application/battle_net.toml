[rule]
id = "windows_app_battle_net_cache"
name = "Blizzard Battle.net Web Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Launcher web cache, agent cache, and logs from Blizzard Battle.net"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Battle.net" }
]

[targets]
paths = [
    { path = "${local_app_data}/Battle.net/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Battle.net/Logs/*", matcher = "glob" },
    { path = "${program_data}/Battle.net/Agent/data/cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
