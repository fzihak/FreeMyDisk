[rule]
id = "windows_app_figma_cache"
name = "Figma Desktop Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Rendered canvas cache, web assets, and font cache from Figma Desktop"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Figma" }
]

[targets]
paths = [
    { path = "${local_app_data}/Figma/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Figma/Code Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Figma/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/settings.json"]
