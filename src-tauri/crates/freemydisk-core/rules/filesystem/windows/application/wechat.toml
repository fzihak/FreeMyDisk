[rule]
id = "windows_app_wechat_cache"
name = "WeChat Web Cache"
category = "application"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web browser engine cache and mini-program temp files from WeChat"
platform = "windows"
locking_processes = ["wechat.exe", "weixin.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Tencent/WeChat" }
]

[targets]
paths = [
    { path = "${app_data}/Tencent/WeChat/All Users/Cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/Msg/*", "*/CustomEmotion/*"]
