[rule]
id = "windows_system_update_download_cache"
name = "Windows Update Download Cache"
category = "system"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Downloaded and already applied Windows Update installation packages (safe to purge)"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${win_dir}/SoftwareDistribution/Download" }
]

[targets]
paths = [
    { path = "${win_dir}/SoftwareDistribution/Download/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
