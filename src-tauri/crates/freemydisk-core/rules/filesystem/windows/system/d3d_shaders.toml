[rule]
id = "windows_system_d3d_shaders"
name = "DirectX & GPU Shader Cache"
category = "system"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-09-09"
author = "FreeMyDisk Team"
description = "Compiled DirectX 3D, NVIDIA, and AMD graphics shader caches safely regenerated by games and apps (1GB-4GB)"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/D3DSCache" }
]

[targets]
paths = [
    { path = "${local_app_data}/D3DSCache/*", matcher = "glob" },
    { path = "${local_app_data}/NVIDIA/DXCache/*", matcher = "glob" },
    { path = "${local_app_data}/AMD/DxCache/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = []
