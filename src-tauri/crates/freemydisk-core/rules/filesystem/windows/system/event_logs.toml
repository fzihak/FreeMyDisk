[rule]
id = "windows_system_archived_event_logs"
name = "Archived Windows Event Logs"
category = "system"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Old archived and rotated Windows diagnostic event logs (.evtx archives)"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${win_dir}/System32/winevt/Logs" }
]

[targets]
paths = [
    { path = "${win_dir}/System32/winevt/Logs/Archive-*.evtx", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["Application.evtx", "System.evtx", "Security.evtx"]
