[rule]
id = "windows_system_thumbnails"
name = "Windows Explorer Thumbnail Cache"
category = "system"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-08-15"
author = "FreeMyDisk Team"
description = "Cached thumbnail database files automatically regenerated by Windows Explorer"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Microsoft/Windows/Explorer" }
]

[targets]
paths = [
    { path = "${local_app_data}/Microsoft/Windows/Explorer/thumbcache_*.db", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
