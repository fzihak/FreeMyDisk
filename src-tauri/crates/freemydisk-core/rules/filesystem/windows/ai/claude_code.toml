[rule]
id = "windows_ai_claude_code_logs"
name = "Claude Code CLI Sessions & Logs"
category = "ai"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Archived session logs, telemetry, and cached subagent recordings from Claude Code"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${user_profile}/.claude" }
]

[targets]
paths = [
    { path = "${user_profile}/.claude/logs/*", matcher = "glob" },
    { path = "${user_profile}/.claude/cache/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["*/config.json", "*/settings.json"]
