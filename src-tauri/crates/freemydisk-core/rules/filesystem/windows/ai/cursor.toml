[rule]
id = "windows_ai_cursor"
name = "Cursor AI Cache & Workspace Storage"
category = "ai"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-09-09"
author = "FreeMyDisk Team"
description = "Cached model responses, symbol index caches, and workspace storage generated by Cursor AI IDE (2GB-10GB)"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Cursor" }
]

[targets]
paths = [
    { path = "${app_data}/Cursor/CachedData/*", matcher = "glob" },
    { path = "${app_data}/Cursor/logs/*", matcher = "glob" },
    { path = "${local_app_data}/cursor-updater/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = [
    "User/settings.json",
    "User/keybindings.json"
]
