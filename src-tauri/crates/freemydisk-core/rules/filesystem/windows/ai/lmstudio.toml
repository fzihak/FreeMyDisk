[rule]
id = "windows_ai_lmstudio_cache"
name = "LM Studio Download & Model Cache"
category = "ai"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Incomplete model downloads, web cache, and temp files from LM Studio"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${user_profile}/.cache/lm-studio" }
]

[targets]
paths = [
    { path = "${user_profile}/.cache/lm-studio/downloads/*", matcher = "glob" },
    { path = "${user_profile}/.cache/lm-studio/tmp/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["*/models/*"]
