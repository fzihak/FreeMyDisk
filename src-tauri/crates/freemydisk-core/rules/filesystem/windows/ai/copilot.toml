[rule]
id = "windows_ai_github_copilot_logs"
name = "GitHub Copilot Local Logs"
category = "ai"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Telemetry logs and token negotiation caches from GitHub Copilot extension"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/github-copilot" }
]

[targets]
paths = [
    { path = "${local_app_data}/github-copilot/logs/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
