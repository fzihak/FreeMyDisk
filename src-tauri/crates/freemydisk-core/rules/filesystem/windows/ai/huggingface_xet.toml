[rule]
id = "windows_ai_huggingface_xet_cache"
name = "HuggingFace XET Data Transfer Cache"
category = "ai"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Transfer staging chunks cached by HuggingFace Hub git-xet integration"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${user_profile}/.cache/huggingface" }
]

[targets]
paths = [
    { path = "${user_profile}/.cache/huggingface/xet/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/hub/models--*"]
