[rule]
id = "windows_container_docker_cache"
name = "Docker Desktop UI & Crash Logs"
category = "system"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-01"
author = "FreeMyDisk Team"
description = "Temporary Electron caches and diagnostic logs from Docker Desktop"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${app_data}/Docker Desktop/Cache" }
]

[targets]
paths = [
    { path = "${app_data}/Docker Desktop/Cache/*", matcher = "glob" },
    { path = "${app_data}/Docker Desktop/Code Cache/*", matcher = "glob" },
    { path = "${app_data}/Docker Desktop/GPUCache/*", matcher = "glob" },
    { path = "${local_app_data}/Docker/log/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
