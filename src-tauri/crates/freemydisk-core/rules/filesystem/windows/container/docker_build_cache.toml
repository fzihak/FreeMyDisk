[rule]
id = "windows_container_docker_build_logs"
name = "Docker Desktop Crash Dumps & Logs"
category = "container"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Accumulated crash dumps and daemon log files from Docker Desktop for Windows"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Docker" }
]

[targets]
paths = [
    { path = "${local_app_data}/Docker/log/*", matcher = "glob" },
    { path = "${local_app_data}/Docker/crash-dumps/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/settings.json"]
