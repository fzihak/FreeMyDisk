[rule]
id = "windows_container_rancher_cache"
name = "Rancher Desktop Cache"
category = "container"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Downloaded k3s binaries and electron web caches from Rancher Desktop"
platform = "windows"
locking_processes = ["rancher desktop.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/rancher-desktop" }
]

[targets]
paths = [
    { path = "${local_app_data}/rancher-desktop/cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
