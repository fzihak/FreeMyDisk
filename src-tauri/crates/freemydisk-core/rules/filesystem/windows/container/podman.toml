[rule]
id = "windows_container_podman_cache"
name = "Podman Desktop Temporary Cache"
category = "container"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Machine image download staging and web engine cache from Podman Desktop"
platform = "windows"
locking_processes = ["podman desktop.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/containers" }
]

[targets]
paths = [
    { path = "${local_app_data}/containers/cache/*", matcher = "glob" },
    { path = "${user_profile}/.local/share/containers/cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
