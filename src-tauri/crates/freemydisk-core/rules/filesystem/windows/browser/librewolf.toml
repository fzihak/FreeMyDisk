[rule]
id = "windows_browser_librewolf_cache"
name = "LibreWolf Browser Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web cache and temp files from LibreWolf privacy browser"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/LibreWolf" }
]

[targets]
paths = [
    { path = "${local_app_data}/LibreWolf/Profiles/*/cache2/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies.sqlite*", "*/places.sqlite*"]
