[rule]
id = "windows_browser_chrome_offline_storage"
name = "Chrome Service Worker Cache"
category = "browser"
risk = "moderate"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Offline service worker caches and stored web application state from Google Chrome"
platform = "windows"
locking_processes = ["chrome.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Google/Chrome/User Data" }
]

[targets]
paths = [
    { path = "${local_app_data}/Google/Chrome/User Data/*/Service Worker/CacheStorage/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["*/cookies*", "*/history*"]
