[rule]
id = "windows_browser_chromium_cache"
name = "Chromium Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Cached web assets and code cache from standard Chromium builds"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Chromium/User Data" }
]

[targets]
paths = [
    { path = "${local_app_data}/Chromium/User Data/*/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Chromium/User Data/*/Code Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Chromium/User Data/*/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies*", "*/history*", "*/Sessions/*", "*/Login Data*"]
