[rule]
id = "windows_browser_arc_cache"
name = "Arc Browser Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web cache and shader caches generated by Arc browser for Windows"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Arc/User Data" }
]

[targets]
paths = [
    { path = "${local_app_data}/Arc/User Data/*/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Arc/User Data/*/Code Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Arc/User Data/*/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies*", "*/history*", "*/Sessions/*", "*/Login Data*"]
