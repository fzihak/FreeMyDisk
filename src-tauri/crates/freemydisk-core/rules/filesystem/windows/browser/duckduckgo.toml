[rule]
id = "windows_browser_duckduckgo_cache"
name = "DuckDuckGo Desktop Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Local web cache and WebView2 cache from DuckDuckGo browser for Windows"
platform = "windows"
locking_processes = ["duckduckgo.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/DuckDuckGo" }
]

[targets]
paths = [
    { path = "${local_app_data}/DuckDuckGo/*/EBWebView/Default/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/DuckDuckGo/*/EBWebView/Default/Code Cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies*", "*/history*"]
