[rule]
id = "windows_browser_samsung_internet_cache"
name = "Samsung Internet Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web cache and GPU shader cache from Samsung Internet for Windows"
platform = "windows"
locking_processes = ["samsunginternet.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Samsung/Samsung Internet" }
]

[targets]
paths = [
    { path = "${local_app_data}/Samsung/Samsung Internet/User Data/*/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Samsung/Samsung Internet/User Data/*/Code Cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies*", "*/history*"]
