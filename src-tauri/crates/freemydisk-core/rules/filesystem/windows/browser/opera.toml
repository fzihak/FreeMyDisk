[rule]
id = "windows_browser_opera_cache"
name = "Opera & Opera GX Browser Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-01"
author = "FreeMyDisk Team"
description = "Web page, image, and media cache generated by Opera and Opera GX browsers"
platform = "windows"
locking_processes = ["opera.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Opera Software" }
]

[targets]
paths = [
    { path = "${local_app_data}/Opera Software/Opera Stable/Cache/Cache_Data/*", matcher = "glob" },
    { path = "${local_app_data}/Opera Software/Opera GX Stable/Cache/Cache_Data/*", matcher = "glob" },
    { path = "${local_app_data}/Opera Software/Opera Stable/GPUCache/*", matcher = "glob" },
    { path = "${local_app_data}/Opera Software/Opera GX Stable/GPUCache/*", matcher = "glob" },
    { path = "${local_app_data}/Opera Software/Opera Stable/ShaderCache/*", matcher = "glob" },
    { path = "${local_app_data}/Opera Software/Opera GX Stable/ShaderCache/*", matcher = "glob" },
    { path = "${app_data}/Opera Software/Opera Stable/Cache/*", matcher = "glob" },
    { path = "${app_data}/Opera Software/Opera GX Stable/Cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
