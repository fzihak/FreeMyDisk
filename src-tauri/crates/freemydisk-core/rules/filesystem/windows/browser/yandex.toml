[rule]
id = "windows_browser_yandex_cache"
name = "Yandex Browser Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web cache, code cache, and shader cache from Yandex Browser"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Yandex/YandexBrowser" }
]

[targets]
paths = [
    { path = "${local_app_data}/Yandex/YandexBrowser/User Data/*/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Yandex/YandexBrowser/User Data/*/Code Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Yandex/YandexBrowser/User Data/*/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies*", "*/history*", "*/Login Data*"]
