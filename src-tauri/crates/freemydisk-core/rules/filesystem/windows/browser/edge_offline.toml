[rule]
id = "windows_browser_edge_offline_storage"
name = "Microsoft Edge Service Worker Cache"
category = "browser"
risk = "moderate"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Offline service worker caches and cached PWA assets from Microsoft Edge"
platform = "windows"
locking_processes = ["msedge.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Microsoft/Edge/User Data" }
]

[targets]
paths = [
    { path = "${local_app_data}/Microsoft/Edge/User Data/*/Service Worker/CacheStorage/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["*/cookies*", "*/history*"]
