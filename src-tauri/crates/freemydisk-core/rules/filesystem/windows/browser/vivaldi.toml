[rule]
id = "windows_browser_vivaldi_cache"
name = "Vivaldi Browser Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Cached web pages, images, and compiled code cache from Vivaldi"
platform = "windows"
locking_processes = ["vivaldi.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Vivaldi/User Data" }
]

[targets]
paths = [
    { path = "${local_app_data}/Vivaldi/User Data/*/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Vivaldi/User Data/*/Code Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Vivaldi/User Data/*/GPUCache/*", matcher = "glob" },
    { path = "${local_app_data}/Vivaldi/User Data/*/DawnCache/*", matcher = "glob" },
    { path = "${local_app_data}/Vivaldi/User Data/*/ShaderCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies*", "*/history*", "*/Sessions/*", "*/Login Data*", "*/Web Data*"]
