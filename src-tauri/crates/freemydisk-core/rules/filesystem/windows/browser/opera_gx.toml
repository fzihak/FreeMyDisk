[rule]
id = "windows_browser_opera_gx_cache"
name = "Opera GX Browser Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Web cache, shader cache, and temp files from Opera GX gaming browser"
platform = "windows"
locking_processes = ["opera.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Opera Software/Opera GX Stable" }
]

[targets]
paths = [
    { path = "${local_app_data}/Opera Software/Opera GX Stable/Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Opera Software/Opera GX Stable/Code Cache/*", matcher = "glob" },
    { path = "${local_app_data}/Opera Software/Opera GX Stable/GPUCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies*", "*/history*", "*/Login Data*"]
