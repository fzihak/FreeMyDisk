[rule]
id = "windows_browser_brave_offline_storage"
name = "Brave Browser Service Worker Cache"
category = "browser"
risk = "moderate"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Offline service worker caches and cached web storage from Brave Browser"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/BraveSoftware/Brave-Browser" }
]

[targets]
paths = [
    { path = "${local_app_data}/BraveSoftware/Brave-Browser/User Data/*/Service Worker/CacheStorage/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = ["*/cookies*", "*/history*"]
