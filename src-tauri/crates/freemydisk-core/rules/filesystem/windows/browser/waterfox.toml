[rule]
id = "windows_browser_waterfox_cache"
name = "Waterfox Browser Cache"
category = "browser"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "HTTP cache and startup cache from Waterfox browser"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Waterfox" }
]

[targets]
paths = [
    { path = "${local_app_data}/Waterfox/Profiles/*/cache2/*", matcher = "glob" },
    { path = "${local_app_data}/Waterfox/Profiles/*/startupCache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/cookies.sqlite*", "*/places.sqlite*"]
