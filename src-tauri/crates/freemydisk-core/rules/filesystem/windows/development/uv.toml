[rule]
id = "windows_dev_uv_cache"
name = "Python UV Fast Package Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-01"
author = "FreeMyDisk Team"
description = "Cached wheels, zipballs, and git checkouts downloaded by Astral uv"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/uv/cache" }
]

[targets]
paths = [
    { path = "${local_app_data}/uv/cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
