[rule]
id = "windows_dev_bun_cache"
name = "Bun Package Manager Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Extracted tarballs and global npm module cache stored by Bun runtime"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${user_profile}/.bun/install/cache" }
]

[targets]
paths = [
    { path = "${user_profile}/.bun/install/cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
