[rule]
id = "windows_dev_deno_cache"
name = "Deno TypeScript & WASM Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Remote module dependencies and compiled V8 code cache stored by Deno"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/deno" }
]

[targets]
paths = [
    { path = "${local_app_data}/deno/deps/*", matcher = "glob" },
    { path = "${local_app_data}/deno/gen/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
