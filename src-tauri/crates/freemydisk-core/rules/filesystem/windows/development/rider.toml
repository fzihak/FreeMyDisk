[rule]
id = "windows_dev_rider_cache"
name = "JetBrains Rider Symbol Caches"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = ".NET assembly index, Roslyn syntax caches, and logs from JetBrains Rider"
platform = "windows"
locking_processes = ["rider64.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/JetBrains" }
]

[targets]
paths = [
    { path = "${local_app_data}/JetBrains/Rider*/caches/*", matcher = "glob" },
    { path = "${local_app_data}/JetBrains/Rider*/log/*", matcher = "glob" }
]

[disposal]
default_action = "trash"
protect_subpaths = []
