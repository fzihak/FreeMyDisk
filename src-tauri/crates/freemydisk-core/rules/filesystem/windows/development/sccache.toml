[rule]
id = "windows_dev_sccache_cache"
name = "sccache Compiler Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Shared compiler cache artifacts stored by sccache (Shared Compilation Cache)"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Mozilla/sccache" }
]

[targets]
paths = [
    { path = "${local_app_data}/Mozilla/sccache/cache/*", matcher = "glob" },
    { path = "${user_profile}/.cache/sccache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
