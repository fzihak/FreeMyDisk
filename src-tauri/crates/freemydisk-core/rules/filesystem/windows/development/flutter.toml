[rule]
id = "windows_dev_flutter_cache"
name = "Flutter DevTools Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Downloaded web builds and temporary logs for Flutter DevTools"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${user_profile}/.flutter-devtools" }
]

[targets]
paths = [
    { path = "${user_profile}/.flutter-devtools/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
