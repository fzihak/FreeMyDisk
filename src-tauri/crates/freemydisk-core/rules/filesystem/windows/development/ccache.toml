[rule]
id = "windows_dev_ccache_cache"
name = "ccache C/C++ Compiler Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Object file and preprocessor cache generated by ccache"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/ccache" }
]

[targets]
paths = [
    { path = "${local_app_data}/ccache/*", matcher = "glob" },
    { path = "${user_profile}/.ccache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = ["*/ccache.conf"]
