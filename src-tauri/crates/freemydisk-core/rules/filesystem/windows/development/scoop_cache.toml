[rule]
id = "windows_dev_scoop_cache"
name = "Scoop Package Download Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Downloaded installer zip files and installers cached by Scoop for Windows"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${user_profile}/scoop/cache" }
]

[targets]
paths = [
    { path = "${user_profile}/scoop/cache/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
