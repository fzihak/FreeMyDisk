[rule]
id = "windows_dev_jetbrains_cache"
name = "JetBrains IDE System Caches & Logs"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-01"
author = "FreeMyDisk Team"
description = "Rebuildable index caches, log dumps and symbol cache from JetBrains IDEs"
platform = "windows"
locking_processes = ["idea64.exe", "pycharm64.exe", "webstorm64.exe", "clion64.exe", "rider64.exe", "goland64.exe", "rustrover64.exe"]

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/JetBrains" }
]

[targets]
paths = [
    { path = "${local_app_data}/JetBrains/*/caches/*", matcher = "glob" },
    { path = "${local_app_data}/JetBrains/*/log/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
