[rule]
id = "windows_dev_composer_vcs_cache"
name = "PHP Composer VCS Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Cloned git and svn repositories cached by PHP Composer"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Composer/cache/vcs" }
]

[targets]
paths = [
    { path = "${local_app_data}/Composer/cache/vcs/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
