[rule]
id = "windows_dev_chocolatey_cache"
name = "Chocolatey Package Installer Cache"
category = "development"
risk = "safe"
verified_rebuildable = true
verified_at = "2026-10-06"
author = "FreeMyDisk Team"
description = "Downloaded installer binaries and temp archives from Chocolatey package manager"
platform = "windows"

[applicability]
conditions = [
    { type = "path_exists", path = "${local_app_data}/Temp/chocolatey" }
]

[targets]
paths = [
    { path = "${local_app_data}/Temp/chocolatey/*", matcher = "glob" }
]

[disposal]
default_action = "permanent"
protect_subpaths = []
