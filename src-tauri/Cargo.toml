[package]
name = "freemydisk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "FreeMyDisk cross-platform disk cleanup and storage intelligence utility"

[lib]
name = "freemydisk_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
freemydisk-core = { path = "crates/freemydisk-core" }
freemydisk-platform = { path = "crates/freemydisk-platform" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.2", features = [] }
tauri-plugin-opener = "2.2"
tauri-plugin-process = "2.2"
tauri-plugin-single-instance = "2.2"
tauri-plugin-updater = "2.2"
dunce = "1.0"
uuid = { version = "1.11", features = ["v4"] }
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

