name: Cleanup rule request
description: Suggest an app or tool whose cache FreeMyDisk should clean
labels: [rule-request]
body:
  - type: input
    id: app
    attributes:
      label: App or tool
      placeholder: "e.g. Figma, Unity, Android Studio"
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Cache folder(s)
      description: Where the app keeps data that is safe to delete (it rebuilds it automatically).
      placeholder: "%LOCALAPPDATA%\\Figma\\DesktopProfile\\Cache"
    validations:
      required: true
  - type: input
    id: process
    attributes:
      label: Process name while running
      placeholder: "figma.exe"
  - type: textarea
    id: why
    attributes:
      label: How do you know it's safe to delete?
      description: Docs, your own testing, or the app's own "clear cache" option.
