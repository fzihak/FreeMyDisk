name: Release

# Builds the signed Windows installer and publishes it with `latest.json`, the
# file installed copies of FreeMyDisk read to find updates.
#
# To ship a new version:
#   1. Bump "version" in package.json, src-tauri/tauri.conf.json and Cargo.toml.
#   2. Merge to main, then push a tag:  git tag v1.1.0 && git push origin v1.1.0
#   3. Approve the "release" deployment on GitHub (Actions > the run > Review).
#   4. Review the draft release and publish it. Installed copies see the update
#      as soon as it is published.
#
# Security:
#   - The signing key lives only in the protected "release" environment. That
#     environment needs the maintainer's approval for every run and only
#     accepts `v*` tags, so pull requests and branches never see the key.
#   - Every third-party action is pinned to a full commit SHA, so a moved or
#     hijacked tag cannot run code next to the key.
#   - The installer gets a GitHub build-provenance attestation. Anyone can check
#     that it was built by this workflow from this repository with:
#       gh attestation verify FreeMyDisk_<version>_x64-setup.exe --repo fzihak/FreeMyDisk

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build, sign & publish (Windows)
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # sign the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # No build cache on release builds: a cache written by another workflow
      # cannot end up inside a signed installer.

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FreeMyDisk ${{ github.ref_name }}"
          releaseBody: "See the changes below. Installed copies of FreeMyDisk will offer this update automatically."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.bundle.conf.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: target/release/bundle/nsis/*-setup.exe
