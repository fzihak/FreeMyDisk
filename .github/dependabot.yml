version: 2
updates:
  # Workflow actions are pinned to commit SHAs. Dependabot proposes their
  # updates once a month as a single grouped pull request, so there is at
  # most one extra branch at a time and every update is reviewed before it runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    # These major versions broke CI or change the release build; update them
    # by hand after testing (tauri-action only runs on a real release).
    ignore:
      - dependency-name: "pnpm/action-setup"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/cache"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri-apps/tauri-action"
        update-types: ["version-update:semver-major"]
